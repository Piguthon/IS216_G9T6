<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 54" width="20" height="54">
  <!-- Office worker walking right: blue shirt, dark trousers, lanyard -->
  <style>
    .leg-a { transform-origin: 10px 29px; animation: swing 0.9s ease-in-out infinite alternate; }
    .leg-b { transform-origin: 10px 29px; animation: swing 0.9s ease-in-out infinite alternate-reverse; }
    .arm-a { transform-origin: 10px 13px; animation: arm 0.9s ease-in-out infinite alternate-reverse; }
    .arm-b { transform-origin: 10px 13px; animation: arm 0.9s ease-in-out infinite alternate; }
    @keyframes swing { from { transform: rotate(-22deg); } to { transform: rotate(22deg); } }
    @keyframes arm { from { transform: rotate(-18deg); } to { transform: rotate(18deg); } }
    @media (prefers-reduced-motion: reduce) { .leg-a, .leg-b, .arm-a, .arm-b { animation: none; } }
  </style>
  <g class="arm-b"><rect x="8.6" y="12" width="2.8" height="14" rx="1.4" fill="#2f5f9e"/><circle cx="10" cy="26.5" r="1.4" fill="#c98f66"/></g>
  <g class="leg-b"><rect x="8.5" y="28" width="3.2" height="22" rx="1.5" fill="#24303d"/><rect x="8.5" y="49" width="5.5" height="2.6" rx="1.2" fill="#111"/></g>
  <g class="leg-a"><rect x="8.5" y="28" width="3.2" height="22" rx="1.5" fill="#2f3c4a"/><rect x="8.5" y="49" width="5.5" height="2.6" rx="1.2" fill="#111"/></g>
  <rect x="6.5" y="11" width="7.5" height="19" rx="3" fill="#3b78c4"/>
  <path d="M8.5 11.5 L10.5 18 L12.2 11.5" stroke="#e4002b" stroke-width="0.7" fill="none"/>
  <rect x="9.7" y="18" width="1.8" height="2.4" fill="#fff"/>
  <rect x="9" y="8" width="3" height="4" fill="#c98f66"/>
  <circle cx="10.8" cy="5.6" r="4.3" fill="#d9a47c"/>
  <path d="M6.4 5.4 Q6.6 0.8 11 1 Q15 1.2 15.1 4.4 Q12.5 3.2 9.6 4 Q8.6 6 7.2 7 Z" fill="#1d1712"/>
  <g class="arm-a"><rect x="8.6" y="12" width="2.8" height="14" rx="1.4" fill="#4a88d4"/><circle cx="10" cy="26.5" r="1.4" fill="#d9a47c"/></g>
</svg>
