<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 54" width="20" height="54">
  <!-- Auntie walking right: floral top, tote bag, umbrella -->
  <style>
    .leg-a { transform-origin: 10px 30px; animation: swing 1.1s ease-in-out infinite alternate; }
    .leg-b { transform-origin: 10px 30px; animation: swing 1.1s ease-in-out infinite alternate-reverse; }
    @keyframes swing { from { transform: rotate(-16deg); } to { transform: rotate(16deg); } }
    @media (prefers-reduced-motion: reduce) { .leg-a, .leg-b { animation: none; } }
  </style>
  <g class="leg-b"><rect x="8.6" y="30" width="3" height="20" rx="1.4" fill="#c98f66"/><rect x="8.4" y="49" width="5" height="2.6" rx="1.2" fill="#8a5a3a"/></g>
  <g class="leg-a"><rect x="8.6" y="30" width="3" height="20" rx="1.4" fill="#d9a47c"/><rect x="8.4" y="49" width="5" height="2.6" rx="1.2" fill="#8a5a3a"/></g>
  <path d="M6 28 H14.5 L15.5 37 H5 Z" fill="#3d3a5c"/>
  <rect x="6" y="11" width="8.5" height="18" rx="3" fill="#d94b6a"/>
  <g fill="#ffd1dc"><circle cx="8" cy="15" r="0.9"/><circle cx="12" cy="18" r="0.9"/><circle cx="9" cy="22" r="0.9"/><circle cx="12.5" cy="25" r="0.9"/></g>
  <rect x="9" y="8" width="3" height="4" fill="#c98f66"/>
  <circle cx="10.8" cy="5.8" r="4.3" fill="#d9a47c"/>
  <path d="M6.2 6.5 Q5.6 0.6 11 0.8 Q16.2 1 15.4 6 Q14 3.4 10.4 3.6 Q8 4 6.2 6.5 Z" fill="#4a4a4a"/>
  <circle cx="7.4" cy="2.6" r="2" fill="#4a4a4a"/>
  <!-- tote bag -->
  <path d="M5 21 Q4 16 7 15" stroke="#c9b48a" stroke-width="0.8" fill="none"/>
  <rect x="2" y="21" width="6" height="7" rx="1" fill="#e9dcb8"/>
  <!-- closed umbrella held forward -->
  <line x1="13" y1="20" x2="18.5" y2="36" stroke="#1d4f91" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M13 20 q-1 -2 1 -2.5" stroke="#5a3a20" stroke-width="0.9" fill="none"/>
  <rect x="11.6" y="17" width="2.6" height="9" rx="1.3" fill="#e0627e"/>
</svg>
